spring:
  datasource:
    url: jdbc:h2:mem:sentinel_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: false
  sql:
    init:
      mode: never
security:
  jwt:
    secret: test-only-sentinelai-jwt-secret-32-characters-minimum
    expiration-ms: 900000
    refresh-expiration-ms: 604800000
ai:
  service:
    url: http://localhost:8000
app:
  cors:
    allowed-origins: http://localhost:3000
