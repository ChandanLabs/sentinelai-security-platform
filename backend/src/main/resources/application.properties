spring.application.name=crossguard-api
server.port=${PORT:8080}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/crossguard}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:crossguard}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:crossguard_dev_password}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.datasource.hikari.maximum-pool-size=5
crossguard.jwt-secret=${JWT_SECRET:local-only-secret-please-replace-before-deploying-1234567890}
crossguard.jwt-hours=${JWT_HOURS:12}
crossguard.demo-access-code=${DEMO_ACCESS_CODE:CG-DEMO-7429}
crossguard.cors-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
