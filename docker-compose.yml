services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: crossguard
      POSTGRES_USER: crossguard
      POSTGRES_PASSWORD: crossguard_dev_password
    ports:
      - "5432:5432"
    volumes:
      - crossguard_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crossguard -d crossguard"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    environment:
      PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/crossguard
      SPRING_DATASOURCE_USERNAME: crossguard
      SPRING_DATASOURCE_PASSWORD: crossguard_dev_password
      JWT_SECRET: local-only-secret-please-replace-before-deploying-1234567890
      DEMO_ACCESS_CODE: CG-DEMO-7429
      CORS_ALLOWED_ORIGINS: http://localhost:3001,http://localhost:3000
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8080
    ports:
      - "3001:3000"
    depends_on:
      - backend

volumes:
  crossguard_pgdata:
