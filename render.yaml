# ============================================================
# SentinelAI — Render Blueprint (render.yaml)
# Docs: https://render.com/docs/blueprint-spec
#
# Services deployed:
#   1. sentinel-db        → Managed PostgreSQL (Render Postgres)
#   2. sentinel-ai        → FastAPI AI service  (Docker, private)
#   3. sentinel-backend   → Spring Boot API     (Docker, private)
#   4. sentinel-frontend  → Next.js dashboard   (Docker, public)
#
# How to deploy:
#   1. Push this repo to GitHub.
#   2. In Render dashboard → "New Blueprint" → select this repo.
#   3. Render reads this file and creates all services automatically.
#   4. Set the secret environment variables marked (sync) in the
#      Render dashboard (Environment → Secret Files / Env Groups).
# ============================================================

databases:
  - name: sentinel-db
    databaseName: sentinel
    user: sentinel_user
    plan: free                  # upgrade to starter ($7/mo) for production
    region: oregon              # pick region closest to your users

services:

  # ── AI Anomaly Detection Service (FastAPI) ───────────────
  - type: web
    name: sentinel-ai
    runtime: docker
    dockerfilePath: ./ai-service/Dockerfile
    rootDir: .
    plan: free
    region: oregon
    # Internal only — the backend calls this service by its private URL
    # Render private URL format: https://sentinel-ai:8000 (internal)
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "8000"

  # ── Spring Boot Backend ──────────────────────────────────
  - type: web
    name: sentinel-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    rootDir: .
    plan: free
    region: oregon
    healthCheckPath: /api/v1/health
    envVars:
      # Datasource — Render injects DATABASE_URL automatically for linked DB
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: sentinel-db
          property: connectionString
          # Render gives a JDBC-style URL; Spring Boot needs jdbc:postgresql://...
          # Use the helper below or set manually in dashboard.
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: sentinel-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: sentinel-db
          property: password
      - key: SPRING_JPA_HIBERNATE_DDL_AUTO
        value: update             # use "validate" once schema is stable
      # AI service private URL — Render private services are reachable as:
      # http://sentinel-ai:8000  (within the same Render region/account)
      - key: AI_SERVICE_URL
        value: http://sentinel-ai:8000
      # JWT — set these as secret env vars in the Render dashboard
      - key: JWT_SECRET
        sync: false               # you enter this manually in the dashboard
      - key: JWT_EXPIRATION_MS
        value: "86400000"

  # ── Next.js Frontend ─────────────────────────────────────
  - type: web
    name: sentinel-frontend
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    rootDir: .
    plan: free
    region: oregon
    healthCheckPath: /
    envVars:
      # The public URL of your backend — fill in after sentinel-backend is deployed
      # Example: https://sentinel-backend.onrender.com
      - key: NEXT_PUBLIC_API_URL
        sync: false               # enter the backend's public URL in the dashboard
