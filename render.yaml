# ============================================================
# SentinelAI — Render Blueprint (render.yaml)
# Docs: https://render.com/docs/blueprint-spec
#
# Services deployed:
#   1. sentinel-db        → Managed PostgreSQL (Render Postgres)
#   2. sentinel-ai        → FastAPI health-only service (Docker, public health endpoint)
#   3. sentinel-backend   → Spring Boot API (Docker)
#   4. sentinel-frontend  → Next.js dashboard (Docker)
#
# How to deploy:
#   1. Push this repo to GitHub.
#   2. In Render dashboard → "New Blueprint" → select this repo.
#   3. Render reads this file and creates all services automatically.
#   4. Set the secret environment variables marked (sync) in the
#      Render dashboard (Environment → Secret Files / Env Groups).
# ============================================================

databases:
  - name: sentinel-db
    databaseName: sentinel
    user: sentinel_user
    plan: free                  # upgrade to starter ($7/mo) for production
    region: oregon              # pick region closest to your users

services:

  # ── AI Anomaly Detection Service (FastAPI) ───────────────
  - type: web
    name: sentinel-ai
    runtime: docker
    dockerfilePath: ./ai-service/Dockerfile
    rootDir: .
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "8000"

  # ── Spring Boot Backend ──────────────────────────────────
  - type: web
    name: sentinel-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    rootDir: .
    plan: free
    region: oregon
    healthCheckPath: /api/v1/health
    envVars:
      # The application builds a JDBC URL from the linked database host/port/name.
      - key: DB_HOST
        fromDatabase:
          name: sentinel-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: sentinel-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: sentinel-db
          property: database
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: sentinel-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: sentinel-db
          property: password
      - key: SPRING_JPA_HIBERNATE_DDL_AUTO
        value: update             # use "validate" once schema is stable
      # Set to the deployed AI service HTTPS URL after the first Blueprint sync.
      - key: AI_SERVICE_URL
        sync: false
      - key: DEMO_INGESTION_KEY
        generateValue: true

  # ── Next.js Frontend ─────────────────────────────────────
  - type: web
    name: sentinel-frontend
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    rootDir: .
    plan: free
    region: oregon
    healthCheckPath: /
    envVars:
      # Runtime server-side proxy target. Set after the backend is deployed.
      - key: BACKEND_URL
        sync: false
